<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6F5CE0">
<title>فروشگاه سکه</title>
<style>
  :root{
    --bg: #F3F0FB;
    --panel: #FFFFFF;
    --ink: #2B2640;
    --muted: #8A83A6;
    --accent: #6F5CE0;
    --accent-2: #FF6F91;
    --success: #1FAE7C;
    --coin-a: #FFD24D;
    --coin-b: #FFA857;
    --shadow: rgba(43, 38, 64, 0.18);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    height:100%;
    margin:0;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--ink);
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    user-select:none;
  }

  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    padding: 10px 16px 14px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
    padding-bottom:8px;
  }

  .title{
    font-size:18px;
    font-weight:700;
    letter-spacing:0.2px;
  }

  .stats{
    display:flex;
    gap:10px;
    align-items:center;
  }

  .pill{
    background:var(--panel);
    border-radius:999px;
    padding:6px 14px;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    box-shadow: 0 2px 8px var(--shadow);
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }

  .pill b{ color:var(--accent); font-variant-numeric: tabular-nums; }

  /* ---------- Coin visual ---------- */
  .coin-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff5cf, var(--coin-a) 55%, var(--coin-b));
    display:inline-block;
    flex-shrink:0;
  }

  /* ---------- Board / main ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:0;
    gap:14px;
  }

  .coin-big{
    width:80px;
    height:80px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff5cf, var(--coin-a) 55%, var(--coin-b));
    box-shadow: 0 6px 16px var(--shadow);
    margin-bottom:6px;
  }

  .balance{
    font-size:34px;
    font-weight:800;
    color:var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .balance-label{
    color:var(--muted);
    font-size:13px;
    margin-bottom:16px;
  }

  button.buy{
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:700;
    font-size:15px;
    padding:14px 30px;
    border-radius:999px;
    box-shadow: 0 3px 10px rgba(111,92,224,0.4);
    cursor:pointer;
    transition: transform .12s ease, background .15s ease;
  }
  button.buy:active{ transform: scale(0.94); background:#5c4bd1; }

  .price-note{
    color:var(--muted);
    font-size:12px;
    margin-top:8px;
  }

  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background:var(--success);
    color:#fff;
    font-weight:700;
    font-size:13px;
    padding:10px 20px;
    border-radius:999px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    opacity:0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events:none;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  .note{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    max-width:320px;
    line-height:1.7;
    margin-top:8px;
  }

  @media (max-height: 380px){
    .title{ font-size:15px; }
    .pill{ font-size:11px; padding:5px 10px; }
    .balance{ font-size:26px; }
    .coin-big{ width:60px; height:60px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="title">فروشگاه سکه</div>
    <div class="stats">
      <div class="pill"><span class="coin-dot"></span>موجودی: <b id="coinPill">۰</b></div>
    </div>
  </header>
  <main>
    <div class="coin-big"></div>
    <div class="balance" id="balance">۰</div>
    <div class="balance-label">سکه</div>
    <button class="buy" id="buyBtn">خرید ۱ سکه</button>
    <div class="price-note">قیمت هر سکه: ۱,۰۰۰ تومان</div>
    <div class="note">این یک نسخه‌ی نمایشی است. سکه‌ها فقط در همین مرورگر ذخیره می‌شوند و پرداخت واقعی انجام نمی‌گیرد.</div>
  </main>
</div>

<div class="toast" id="toast">۱ سکه اضافه شد ✔</div>

<script>
(function(){
  const STORAGE_KEY = 'coinShopBalance';

  const balanceEl = document.getElementById('balance');
  const coinPillEl = document.getElementById('coinPill');
  const buyBtn = document.getElementById('buyBtn');
  const toast = document.getElementById('toast');

  const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  function faNum(n){ return String(n).split('').map(d => FA_DIGITS[+d] ?? d).join(''); }

  let coins = 0;
  let toastTimeout = null;

  function loadCoins(){
    try{
      const v = localStorage.getItem(STORAGE_KEY);
      return v ? parseInt(v, 10) : 0;
    }catch(e){
      return 0;
    }
  }

  function saveCoins(n){
    try{
      localStorage.setItem(STORAGE_KEY, String(n));
    }catch(e){}
  }

  function renderCoins(){
    balanceEl.textContent = faNum(coins);
    coinPillEl.textContent = faNum(coins);
  }

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function buyCoin(){
    // در نسخه‌ی واقعی، اینجا باید فرآیند پرداخت درون‌برنامه‌ای بازار صدا زده شود
    // و فقط پس از تایید موفق پرداخت، تابع onPurchaseSuccess() اجرا شود.
    onPurchaseSuccess();
  }

  function onPurchaseSuccess(){
    coins += 1;
    saveCoins(coins);
    renderCoins();
    showToast('۱ سکه اضافه شد ✔');
  }

  buyBtn.addEventListener('click', buyCoin);

  coins = loadCoins();
  renderCoins();
})();
</script>

</body>
</html>
